
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17243a">
<title>Snappy AI 13.0</title>
<style>
:root{
--bg:#f2f5fa;--panel:#fff;--ink:#182338;--muted:#68758b;
--line:#e2e8f0;--blue:#2878e8;--soft:#edf4ff;
--shadow:0 8px 26px #1c31500d
}
[data-theme=dark]{
--bg:#101827;--panel:#1b293d;--ink:#f1f5fb;--muted:#aab6c8;
--line:#34445b;--blue:#69a7ff;--soft:#263b59;
--shadow:0 8px 26px #0002
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;padding:18px 15px 32px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:15px;background:var(--blue);
display:grid;place-items:center;color:white;font-size:24px}
.brand{flex:1}.brand h1{font-size:21px;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;
background:var(--blue);color:white;font-weight:650}
button.secondary{background:var(--soft);color:var(--ink)}
button.ghost{background:transparent;color:var(--muted);padding:7px}
.nav{display:flex;gap:7px;overflow:auto;padding:7px;background:var(--panel);
border:1px solid var(--line);border-radius:16px;margin-bottom:20px;
box-shadow:var(--shadow)}
.nav button{white-space:nowrap;background:transparent;color:var(--muted);
padding:9px 12px;font-size:13px}
.nav button.active{background:var(--blue);color:white}
h2{font-size:25px;margin:0 0 5px}
h3{margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{background:var(--panel);border:1px solid var(--line);
border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin:5px 0}
.stat .ico{font-size:21px}
.row{display:flex;align-items:center;gap:9px}.row>*:first-child{flex:1}
.field{width:100%;padding:12px 13px;border:1px solid var(--line);
border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
.field:focus{border-color:var(--blue)}
.stack{display:grid;gap:9px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;
border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item label{flex:1;overflow-wrap:anywhere}
.item.done label{text-decoration:line-through;color:var(--muted)}
.delete{background:transparent;color:var(--muted);padding:5px 8px}
.msg{padding:12px 14px;border-radius:14px;background:var(--soft);
margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you{background:var(--blue);color:white;margin-left:12%}
.msg small{display:block;opacity:.7;font-size:11px;margin-bottom:4px}
.progress{height:8px;background:var(--line);border-radius:99px;
overflow:hidden;margin:12px 0}
.progress span{display:block;height:100%;background:var(--blue)}
.muted{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:11px;margin:20px 0 0}
@media(min-width:600px){
.app{padding:28px 24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo">✦</div>
 <div class="brand">
  <h1>Snappy AI</h1>
  <p>Your personal productivity assistant · 13.0</p>
 </div>
 <button class="secondary" id="themeBtn">☾</button>
</header>

<nav class="nav" id="nav">
 <button class="active" data-page="Home">✦ Home</button>
 <button data-page="Tasks">✦ Tasks</button>
 <button data-page="Reminders">✦ Reminders</button>
 <button data-page="Chat">✦ AI Chat</button>
 <button data-page="Maths">∑ Maths</button>
 <button data-page="Projects">✦ Projects</button>
</nav>

<main id="content"></main>
<footer>SNAPPY AI 13.0 ✦ PERSONAL DASHBOARD</footer>
</div>

<script>
const $=s=>document.querySelector(s);

function load(key,defaultValue){
 try{
  const value=localStorage.getItem(key);
  return value===null?defaultValue:JSON.parse(value);
 }catch{return defaultValue}
}
function save(){
 try{
  localStorage.setItem("snappy13_tasks",JSON.stringify(tasks));
  localStorage.setItem("snappy13_reminders",JSON.stringify(reminders));
  localStorage.setItem("snappy13_projects",JSON.stringify(projects));
  localStorage.setItem("snappy13_messages",JSON.stringify(messages));
  localStorage.setItem("snappy13_theme",JSON.stringify(theme));
 }catch(e){console.log("Could not save data",e)}
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

let tasks=load("snappy13_tasks",[
 {id:1,name:"Review today's schoolwork",done:false},
 {id:2,name:"Check tomorrow's schedule",done:false}
]);
let reminders=load("snappy13_reminders",[]);
let projects=load("snappy13_projects",["My first project"]);
let messages=load("snappy13_messages",[
 {from:"Snappy",text:"Hi! I'm Snappy AI 13.0. How can I help you today?"}
]);
let page="Home";
let theme=load("snappy13_theme","light");

function applyTheme(){
 document.documentElement.dataset.theme=theme;
 $("#themeBtn").textContent=theme==="dark"?"☀":"☾";
 document.querySelector('meta[name="theme-color"]').content=
  theme==="dark"?"#17243a":"#f2f5fa";
}
$("#themeBtn").onclick=()=>{
 theme=theme==="dark"?"light":"dark";
 applyTheme();save();
};

function go(p){
 page=p;
 $("#nav").querySelectorAll("button").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===p);
 });
 render();
}
$("#nav").addEventListener("click",e=>{
 const b=e.target.closest("button[data-page]");
 if(b)go(b.dataset.page);
});

function render(){
 const content=$("#content");
 const done=tasks.filter(t=>t.done).length;
 const percent=tasks.length?Math.round(done/tasks.length*100):0;

 if(page==="Home"){
  content.innerHTML=`
  <h2>Welcome back! 👋</h2>
  <p class="sub">Your personal assistant dashboard.</p>
  <div class="grid">
   <div class="card stat"><span class="ico">✓</span><small>Total tasks</small><strong>${tasks.length}</strong></div>
   <div class="card stat"><span class="ico">⏰</span><small>Reminders</small><strong>${reminders.length}</strong></div>
   <div class="card stat"><span class="ico">▣</span><small>Projects</small><strong>${projects.length}</strong></div>
   <div class="card stat"><span class="ico">★</span><small>Completed</small><strong>${done}</strong></div>
  </div>
  <section class="card">
   <h3>Task progress</h3>
   <div class="progress"><span style="width:${percent}%"></span></div>
   <p class="muted">${percent}% completed</p>
  </section>
  <section class="card">
   <h3>Today's date</h3>
   <p>${new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</p>
  </section>
  <section class="card">
   <h3>Quick actions</h3>
   <div class="row">
    <button onclick="go('Tasks')">Add a task</button>
    <button class="secondary" onclick="go('Chat')">Ask Snappy</button>
   </div>
  </section>`;
 }

 if(page==="Tasks"){
  content.innerHTML=`
  <h2>My Tasks</h2><p class="sub">Keep track of what you need to do.</p>
  <section class="card">
   <form id="taskForm" class="stack">
    <input class="field" id="taskInput" placeholder="Enter a task..." required>
    <button>Add Task</button>
   </form>
   <div style="margin-top:12px">
   ${tasks.map(t=>`
    <div class="item ${t.done?"done":""}">
     <input type="checkbox" data-task="${t.id}" ${t.done?"checked":""}>
     <label>${esc(t.name)}</label>
     <button class="delete" data-delete-task="${t.id}">Delete</button>
    </div>`).join("")||'<p class="muted">No tasks yet.</p>'}
   </div>
  </section>`;
  $("#taskForm").onsubmit=e=>{
   e.preventDefault();
   const v=$("#taskInput").value.trim();
   if(v){tasks.push({id:Date.now(),name:v,done:false});save();render()}
  };
  content.querySelectorAll("[data-task]").forEach(el=>{
   el.onchange=()=>{
    const t=tasks.find(x=>x.id===Number(el.dataset.task));
    if(t){t.done=el.checked;save();render()}
   };
  });
  content.querySelectorAll("[data-delete-task]").forEach(el=>{
   el.onclick=()=>{
    tasks=tasks.filter(t=>t.id!==Number(el.dataset.deleteTask));
    save();render();
   };
  });
 }

 if(page==="Reminders"){
  content.innerHTML=`
  <h2>My Reminders</h2><p class="sub">Keep important things in mind.</p>
  <section class="card">
   <form id="reminderForm" class="stack">
    <input class="field" id="remName" placeholder="Reminder name..." required>
    <input class="field" id="remWhen" type="datetime-local" required>
    <button>Add Reminder</button>
   </form>
   <div style="margin-top:12px">
   ${reminders.map(r=>`
    <div class="item">
     <label><strong>${esc(r.name)}</strong><br><small class="muted">${esc(r.when)}</small></label>
     <button class="delete" data-delete-rem="${r.id}">Delete</button>
    </div>`).join("")||'<p class="muted">No reminders yet.</p>'}
   </div>
  </section>`;
  $("#reminderForm").onsubmit=e=>{
   e.preventDefault();
   reminders.push({id:Date.now(),name:$("#remName").value.trim(),when:$("#remWhen").value});
   save();render();
  };
  content.querySelectorAll("[data-delete-rem]").forEach(el=>{
   el.onclick=()=>{
    reminders=reminders.filter(r=>r.id!==Number(el.dataset.deleteRem));
    save();render();
   };
  });
 }

 if(page==="Projects"){
  content.innerHTML=`
  <h2>My Projects</h2><p class="sub">Organise your ideas and projects.</p>
  <section class="card">
   <form id="projectForm" class="stack">
    <input class="field" id="projectInput" placeholder="Project name..." required>
    <button>Add Project</button>
   </form>
   <div style="margin-top:12px">
   ${projects.map((p,i)=>`
    <div class="item">
     <label>${esc(p)}</label>
     <button class="delete" data-delete-project="${i}">Delete</button>
    </div>`).join("")||'<p class="muted">No projects yet.</p>'}
   </div>
  </section>`;
  $("#projectForm").onsubmit=e=>{
   e.preventDefault();
   const v=$("#projectInput").value.trim();
   if(v){projects.push(v);save();render()}
  };
  content.querySelectorAll("[data-delete-project]").forEach(el=>{
   el.onclick=()=>{
    projects.splice(Number(el.dataset.deleteProject),1);
    save();render();
   };
  });
 }

 if(page==="Chat"){
  content.innerHTML=`
  <h2>Snappy AI Chat</h2><p class="sub">Ask questions or manage your day.</p>
  <section class="card">
   <div id="chatMessages">
    ${messages.map(m=>`<div class="msg ${m.from==="You"?"you":""}"><small>${esc(m.from)}</small>${esc(m.text)}</div>`).join("")}
   </div>
   <form id="chatForm" class="row">
    <input class="field" id="chatInput" placeholder="Message Snappy..." autocomplete="off" required>
    <button>Send</button>
   </form>
   <p class="muted">Snappy 13.0 uses built-in responses and online topic lookups. It is not connected to a full AI language model.</p>
  </section>`;
  const box=$("#chatMessages");
  box.scrollTop=box.scrollHeight;
  $("#chatForm").onsubmit=async e=>{
   e.preventDefault();
   const input=$("#chatInput");
   const q=input.value.trim();
   if(!q)return;
   input.value="";
   messages.push({from:"You",text:q});
   messages.push({from:"Snappy",text:"Thinking..."});
   save();render();
   const answer=await getSnappyReply(q);
   const last=messages[messages.length-1];
   if(last&&last.from==="Snappy")last.text=answer;
   save();render();
  };
 }

 if(page==="Maths"){
  content.innerHTML=`
  <h2>Snappy Maths</h2><p class="sub">Try arithmetic or simple algebra.</p>
  <section class="card">
   <form id="mathForm" class="stack">
    <input class="field" id="mathInput" placeholder="Example: 2x + 5 = 15" required>
    <button>Solve</button>
   </form>
   <div id="mathAnswer" class="msg" style="display:none;margin-top:14px"></div>
  </section>
  <section class="card">
   <h3>Examples</h3>
   <p class="muted">25 × 4 + 10</p>
   <p class="muted">2x + 5 = 15</p>
   <p class="muted">3x = 21</p>
  </section>`;
  $("#mathForm").onsubmit=e=>{
   e.preventDefault();
   const answer=$("#mathAnswer");
   answer.style.display="block";
   answer.textContent=solveMath($("#mathInput").value);
  };
 }
}

function addChat(from,text){
 messages.push({from,text});
 if(messages.length>100)messages=messages.slice(-100);
 save();
}

function solveMath(input){
 let q=input.toLowerCase().replace(/×/g,"*").replace(/÷/g,"/").replace(/\s+/g,"").replace(/\?$/,"");
 let m;

 m=q.match(/^(-?\d+(?:\.\d+)?)x([+-]\d+(?:\.\d+)?)=(-?\d+(?:\.\d+)?)$/);
 if(m){
  const a=Number(m[1]),b=Number(m[2]),c=Number(m[3]);
  if(a===0)return "The equation has no unique solution.";
  return `Step 1: ${a}x ${b>=0?"+":""} ${b} = ${c}\nStep 2: Move the constant to the other side.\nStep 3: ${a}x = ${c-b}\nStep 4: Divide by ${a}.\nAnswer: x = ${(c-b)/a}`;
 }

 m=q.match(/^(-?\d+(?:\.\d+)?)x=(-?\d+(?:\.\d+)?)$/);
 if(m){
  const a=Number(m[1]),b=Number(m[2]);
  if(a===0)return "This equation has no unique solution.";
  return `Divide both sides by ${a}.\nAnswer: x = ${b/a}`;
 }

 m=q.match(/^(-?\d+(?:\.\d+)?)([+\-*/])(-?\d+(?:\.\d+)?)$/);
 if(m){
  const a=Number(m[1]),b=Number(m[3]),op=m[2];
  if(op==="/"&&b===0)return "Division by zero is undefined.";
  const result=op==="+"?a+b:op==="-"?a-b:op==="*"?a*b:a/b;
  return `Answer: ${result}`;
 }
 return "I couldn't recognise that question. I currently support basic arithmetic and simple linear equations, such as 2x + 5 = 15.";
}

async function getWeather(place){
 try{
  const geo=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(place)+"&count=1&language=en&format=json");
  if(!geo.ok)throw Error();
  const locations=await geo.json();
  if(!locations.results?.length)return "I couldn't find that location.";
  const loc=locations.results[0];
  const response=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m`);
  if(!response.ok)throw Error();
  const data=await response.json();
  const w=data.current;
  const descriptions={0:"clear sky",1:"mainly clear",2:"partly cloudy",3:"overcast",45:"foggy",48:"foggy",51:"light drizzle",53:"drizzle",55:"heavy drizzle",61:"light rain",63:"rain",65:"heavy rain",80:"rain showers",81:"rain showers",82:"heavy rain showers",95:"thunderstorm",96:"thunderstorm with hail",99:"thunderstorm with hail"};
  return `Weather in ${loc.name}: ${w.temperature_2m}°C, ${descriptions[w.weather_code]||"conditions unavailable"}.\nFeels like: ${w.apparent_temperature}°C\nHumidity: ${w.relative_humidity_2m}%\nWind: ${w.wind_speed_10m} km/h\nPrecipitation: ${w.precipitation} mm`;
 }catch{return "I couldn't fetch the weather. Please check your internet connection and try again."}
}

async function getWikiAnswer(query){
 try{
  const response=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(query.replace(/\s+/g,"_")));
  if(!response.ok)return null;
  const data=await response.json();
  if(data.type==="disambiguation")return "That topic has several meanings. Could you be more specific?";
  return data.extract||null;
 }catch{return null}
}

async function getSnappyReply(message){
 const q=message.trim();
 const lower=q.toLowerCase();

 if(/\b(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(lower))
  return "Hello! Welcome to Snappy AI 13.0. What can I help you with today?";

 if(/\b(who are you|what are you)\b/.test(lower))
  return "I'm Snappy AI 13.0, your personal assistant for tasks, reminders, maths and information lookups.";

 if(/\b(what time is it|current time)\b/.test(lower))
  return "The current time is "+new Date().toLocaleTimeString()+".";

 if(/\b(what day is it|today's date|what is the date)\b/.test(lower))
  return "Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";

 if(/\b(weather|temperature|forecast|rain today)\b/.test(lower)){
  const match=q.match(/\b(?:in|at|for)\s+([a-zA-Z\s-]+?)(?:\?|$)/i);
  return await getWeather(match?match[1].trim():"Singapore");
 }

 if(/\b(add|create|make)\s+(?:a\s+)?task\b/.test(lower)){
  const task=q.replace(/^.*?\btask\b\s*/i,"").trim();
  if(!task)return "What task would you like me to add?";
  tasks.push({id:Date.now(),name:task,done:false});
  save();return "Added your task: "+task;
 }

 if(/\b(add|create|set)\s+(?:a\s+)?reminder\b/.test(lower)){
  const reminder=q.replace(/^.*?\breminder\b\s*/i,"").trim();
  if(!reminder)return "What would you like me to remind you about?";
  reminders.push({id:Date.now(),name:reminder,when:"No time specified"});
  save();return "Added your reminder: "+reminder;
 }

 if(/\b(solve|calculate|what is|evaluate)\b/i.test(q)&&/[\d]/.test(q))
  return solveMath(q.replace(/^(solve|calculate|what is|evaluate)\s*/i,"").replace(/\?$/,""));

 if(/\b(thank you|thanks)\b/.test(lower))
  return "You're welcome! Happy to help.";

 if(/\b(help|what can you do)\b/.test(lower))
  return "I can help with basic maths, weather lookups, tasks, reminders, dates and general topic searches. Try asking me something!";

 const wiki=await getWikiAnswer(q);
 if(wiki)return wiki;

 return "I don't know that one yet. I can look up many topics, but I may not understand every question like a full AI chatbot.";
}

applyTheme();
render();
</script>
</body>
</html>
